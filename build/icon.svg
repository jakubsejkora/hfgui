<!--
  hfgui app icon — the source for build/icon.icns and build/icon.png.
  Re-render after editing with `npm run icon`.

  Laid out on Apple's macOS icon grid: an 824 px rounded square with 100 px of
  margin in a 1024 canvas, the margin holding the drop shadow. macOS 26 frames
  icons that stray from that shape in a grey tile, so keep the body on the grid.

  The app's own visual language: a graphite tile, a white download arrow, and
  the one accent — signal red — as the slot the model lands in.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185.4" />
    </clipPath>

    <!-- Graphite, lit from above. -->
    <linearGradient id="tile" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e2e33" />
      <stop offset="1" stop-color="#0f0f11" />
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="160" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Signal red, a touch brighter on its top edge. -->
    <linearGradient id="slot" x1="0" y1="652" x2="0" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4493c" />
      <stop offset="1" stop-color="#d92e22" />
    </linearGradient>

    <filter id="lift" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glyph" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="slot-glow" x="-30%" y="-150%" width="160%" height="400%">
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#f0382b" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#lift)">
    <g clip-path="url(#body)">
      <rect x="100" y="100" width="824" height="824" fill="url(#tile)" />
      <rect x="100" y="100" width="824" height="824" fill="url(#glow)" />

      <!-- the model, coming down -->
      <path
        d="M512 276 V 556 M 396 440 L 512 556 L 628 440"
        fill="none"
        stroke="#ffffff"
        stroke-width="80"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glyph)"
      />

      <!-- the slot it lands in -->
      <rect x="332" y="652" width="360" height="72" rx="36" fill="url(#slot)" filter="url(#slot-glow)" />

      <rect x="100" y="100" width="824" height="824" rx="185.4" fill="none" stroke="url(#rim)" stroke-width="5" />
    </g>
  </g>
</svg>
